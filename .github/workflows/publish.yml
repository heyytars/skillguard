name: Publish Package

# Publishes via npm Trusted Publishing (OIDC). No NPM_TOKEN secret needed.
# Requires the Trusted Publisher set on npmjs.com:
#   owner heyytars, repo skillguard, workflow publish.yml
# No untrusted event input is used in any run: step.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org/'

      - run: npm ci

      - run: npm run build

      - run: npm run test

      - name: Publish to npm
        run: npm publish --access public

      - name: Show npm debug log on failure
        if: failure()
        run: cat /home/runner/.npm/_logs/*.log 2>/dev/null || echo "No log file found"
