name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - run: npm test

  benchmark:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    # Fails if an attack is missed or an ordinary skill is flagged. The summary
    # goes in the job output so a regression shows up without opening the log.
    - name: Run benchmark
      run: python3 bench/run.py | tee bench-out.txt
    # Also scans real third-party skills at pinned commits. The cache keeps this
    # from cloning on every push; the key moves when the pins in bench/run.py do.
    - name: Cache third-party corpora
      uses: actions/cache@v4
      with:
        path: ~/.cache/skillguard-bench
        key: skillguard-bench-${{ hashFiles('bench/run.py') }}
    - name: Run benchmark against third-party skills
      run: python3 bench/run.py --corpus | tee -a bench-out.txt
    - name: Write summary
      if: always()
      run: |
        {
          echo '## skillguard benchmark'
          echo '```'
          cat bench-out.txt 2>/dev/null || echo "benchmark did not run"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
